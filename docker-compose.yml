version: '3.9'
services:
  backend:
    image: python:3.13-slim
    working_dir: /app
    command: sh -c "pip install -r backend/requirements.txt && python backend/run_backend.py"
    volumes:
      - ./:/app
      - local_agent_data:/app/backend/data
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - local_agent_redis:/data

volumes:
  local_agent_data:
  local_agent_redis:

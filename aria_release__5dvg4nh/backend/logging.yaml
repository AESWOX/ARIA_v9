version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  detailed:
    format: '%(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: ./data/logs/aria.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf-8

  errors:
    class: logging.handlers.RotatingFileHandler
    level: WARNING
    formatter: detailed
    filename: ./data/logs/aria-errors.log
    maxBytes: 10485760
    backupCount: 3
    encoding: utf-8

loggers:
  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [console, file, errors]
    propagate: false

  uvicorn.access:
    level: WARNING
    handlers: [console, file]
    propagate: false

  sqlalchemy.engine:
    level: WARNING
    handlers: [file]
    propagate: false

  alembic:
    level: INFO
    handlers: [file]
    propagate: false

  local_agent:
    level: DEBUG
    handlers: [console, file, errors]
    propagate: false

root:
  level: WARNING
  handlers: [console, file, errors]
